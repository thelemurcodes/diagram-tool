name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + contract tests (jest, embedded Postgres; no Anthropic key needed)
        run: npm test

      - name: Build server
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E against local backend (recorded-response fake; keyless)
        run: node e2e/local.js
        env:
          BACKEND_PORT: '8080'
          FRONTEND_PORT: '3000'
          ALLOWED_ORIGIN: 'http://localhost:3000'
          EVIDENCE_DIR: e2e-artifacts

      - name: Upload E2E screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-artifacts/
